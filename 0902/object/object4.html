<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 화살표 함수와 this
        let user = {
            name: '홍길동',
            age: 25,
            greet1: function(){
                return `안녕하세요, ${this.name}님!`;
            },
            greet2: ()=>{
                return `안녕하세요, ${this.name}님!`;
                // 화살표함수는 자신만의 this를 가질 수 없음
            }
        };
        // delete user.city;
        // user.age = 26;
        console.log(user.greet1()); 
        console.log(user.greet2()); 
    </script>
</body>
</html>
