<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let str = "JavaScript";

        console.log(str.length);
        console.log(str.toUpperCase());
        console.log(str.toLowerCase());
        console.log(str.indexOf("S")); // 문자 위치를 인덱스 번호로 반환 4 없으면 -1
        console.log(str.substring(2,4)); // 2번부터 4번 전까지
        console.log(str.substr(2,4)); // 2번부터 4글자
        console.log(str.replace("Java","Html"));
    </script>
</body>
</html>
