<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0; padding: 0;}
        section{
            width: 100%;
            /* height 100%; */
            height: 100vh;
        }
        .section1{
            /* background-color: greenyellow;
            background-image: url(images/back1.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%; */
            background: greenyellow url(images/back1.jpg) no-repeat 50% 50% / cover
            /* 위에껄 한 줄로 표시*/
            /* '/' 사이즈를 구분하기 위해 씀 */
        }
        .section2{
            background-color: sandybrown;
            background-image: url(images/back2.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
        }
        .section3{
            background-color: magenta;
            background-image: url(images/back3.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
            background-attachment: fixed; /* 이미지가 배경에 고정됨 */
        }
        .section4{
            background-color: khaki;
            background-image: url(images/back4.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
        }
        .section5{
            background-color: indianred;
            background-image: url(images/back5.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 50% 50%;
        }
    </style>
</head>
<body>
    <section class="section1">배경1</section>
    <section class="section2">배경2</section>
    <section class="section3">배경3</section>
    <section class="section4">배경4</section>
    <section class="section5">배경5</section>
    
</body>
</html>
