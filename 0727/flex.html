<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Float & Clearfix</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Malgun Gothic", sans-serif;
    background:#f4f4f4;
    padding:40px;
}

/* 부모 */
.container{
    width:900px;
    margin:0 auto;
    background:#fff;
    border:3px solid red;
    padding:20px;
    display: flex;
    gap: 15px;
}


/* 카드 */
.card{
    /* 넓이 생략 */
    flex:1;
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    padding:20px;

    box-shadow:0 3px 8px rgba(0,0,0,.15);
}


</style>

</head>
<body>

<div class="container">

    <div class="card">
        <h2>HTML</h2>
        <p>
            HTML은 웹페이지의 구조를 만드는 언어입니다.
        </p>
    </div>

    <div class="card">
        <h2>CSS</h2>
        <p>
            CSS는 웹페이지의 디자인을 담당합니다.
        </p>
    </div>

    <div class="card">
        <h2>JavaScript</h2>
        <p>
            JavaScript는 웹페이지에 동작을 추가합니다.
        </p>
    </div>
    <div class="clear">

    </div>

</div>

</body>
</html>
