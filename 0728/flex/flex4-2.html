<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex-container{
            width: 1500px;
            background-color: dodgerblue;
            display: flex;
            height: 200px;
           justify-content: space-around;
           align-items: center;
            
        }
        .flex-container > div{
            background-color: #f1f1f1;
            width: 100px;
            margin: 10px;
            text-align: center;
            line-height: 75px;
            font-size: 30px;
            /* float: left; */
        }
        .box1{
            flex: 2;
        }
        .box2{
            flex: 3;
        }
        .box3{
            flex: 5;
        }
    </style>
</head>
<body>
    <h1>Flexible Boxes</h1>
    <div class="flex-container">
        <div class="box1">1</div>
        <div class="box2">2</div>
        <div class="box3">3</div>
    </div>
</body>
</html>
