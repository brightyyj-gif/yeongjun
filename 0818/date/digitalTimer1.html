<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<script>
    setInterval(function(){
    var today = new Date();
    var year = today.getFullYear(); //today 년도만 가져와서 year 대입
    var month = today.getMonth()+1;
    var date = today.getDate();
    var day = today.getDay();
    console.log(year, month, date, day);
    //배열사용
        let yoil = ["일","월","화","수","목","금","토"];
        let yo = yoil[day];
        // alert(yo);
        var hour = today.getHours();
        var min = today.getMinutes();
        var sec = today.getSeconds();

        // document.write(year + "년 " + month + "월 " + date + "일 " +yoil);
        document.write(`${year}년  ${month}월 ${date}일 ${hour}시 ${min}분 ${sec}초`);
        },1000);
</script>
</head>
<body>
    <h1 id="clock">
        <span id="year">0000</span>년
        <span id="month">00</span>월
        <span id="date">00</span>일
        <span id="yoil">0</span>
        <span id="hour">00</span>시
        <span id="minute">00</span>분
        <span id="second">00</span>초
    </h1>
</body>
</html>
