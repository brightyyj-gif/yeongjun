<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/jquery.bxslider.css">
    <script src="js/jquery-3.1.1.min.js"></script>
    <script src="js/jquery.bxslider.min.js"></script>
    
    <style>
        *{margin: 0;padding: 0;}
        header{
            width: 100%;
            max-width: 960px;
            /* 평소크기 960px - 960이하일때 100% */
            height: 200px;
            margin: 0 auto;
            background-color: pink;
        }
        section{
            width: 100%;
            max-width: 960px;
            height: 800px;
            margin: 0 auto;
            border: 1px solid red;
        }
    </style>

    <script>
        $(function(){
            // ul 클래스 slider
            // $(".slider").bxSlider({
            //     auto:true, // 자동슬라이드
            //     controls:false, // 좌우 화살표 숨김
            //     pager:false // 페이저 숨김
            // });

            $(".slider").bxSlider({
                auto:true, // 자동슬라이드
                moveSlides:1, // 한번에 슬라이드되는 사진 수
                minSlides:1, // 반응형
                maxSlides:3, // 반응형
                slideWidth:305, // 한개 슬라이드 이미지의 넓이
                slidemargin:10, // 슬라이드간의 여백
                shrinkItems:true, // 슬라이드 너비 자동조정 되면서 슬라이드 표시 개수 제한

            });
        });
    </script>
</head>
<body>
    <header>헤더</header>
    <section>
        <ul class="slider">
            <li><img src="img/images(1).jpg" alt="사진1"></li>
            <li><img src="img/images(2).jpg" alt="사진2"></li>
            <li><img src="img/images(3).jpg" alt="사진3"></li>
            <li><img src="img/images(4).jpg" alt="사진4"></li>
            <li><img src="img/images(5).jpg" alt="사진5"></li>
        </ul>
    </section>
</body>
</html>
