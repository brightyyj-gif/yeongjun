<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{list-style: none; border: 1px solid #333; width: 300px;}
        ul li{float: left}
        .cf::after{
            content: "";
            display: block;
            clear: both;
        }
    </style>
</head>
<body>
    <ul class="cf">
        <li>난 1번</li>
        <li>난 2번</li>
        <li>난 3번</li>
        <li>난 4번</li>
    </ul>
</body>
</html>
