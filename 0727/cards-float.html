<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      background: #f0f2f5;
      color: #222;
      line-height: 1.5;
      padding: 40px 20px 80px;
    }
    h1{
        text-align: center;
        font-size: 28px;
        margin-bottom: 12px;
    }
    .intro{
        text-align: center;
        color: #666;
        margin-bottom: 48px;
    }
    section{
        max-width: 1100px;
        margin: 0 auto;
        background: #fff;
        border-radius: 12px;
        padding: 28px 24px 32px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }
    section h2{
        font-size: 22px;
        margin-bottom: 8px;
    }
    section .desc{
        color:#666;
        font-size: 12px;
        margin-bottom: 24px;
    }
    .card{
        background-color: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }
    .card img{
        width: 100%;
        height: 180px;
        object-fit: cover;
        /* 이미지를 .card에 꽉 채움 background-size cover와 비슷 */
        display: block;
    }
    .card-body{
        padding: 16px;
    }
    .card-body h3{
        font-size: 18px;
        margin-bottom: 8px;
    }
    .card-body p{
        font-size: 12px;
        color:#555;
    }
    .float-wrap::after{
        content: "";
        display: block;
        clear: both;
    }    
    .float-wrap .card{
        float: left;
        width: 30%;
        margin-right: 3.3%;
    }
    /* 화면의 너비가 768보다 작거나 같으면 */
    @media (max-width:768px){
        .float-wrap .card{
            float: none;
            width: 100;
            margin-right: 0;
            margin-bottom: 20px;
        }
    }
    </style>
</head>
<body>
      <h1>카드 레이아웃 - Float</h1>
  <p class="intro">이미지 + 글자 카드 3개를 Float로 배치했습니다.</p>

  <section>
    <h2>Float</h2>
    <p class="desc">카드에 <code>float: left</code>를 주고, 부모에 clearfix 처리합니다.</p>

    <div class="float-wrap">
      <article class="card">
        <img src="https://picsum.photos/id/1015/600/400" alt="산 풍경">
        <div class="card-body">
          <h3>산 여행</h3>
          <p>맑은 공기와 함께하는 산속 힐링 코스입니다.</p>
        </div>
      </article>

      <article class="card">
        <img src="https://picsum.photos/id/1016/600/400" alt="도시 풍경">
        <div class="card-body">
          <h3>도시 탐방</h3>
          <p>밤낮으로 빛나는 도심의 매력을 만나보세요.</p>
        </div>
      </article>

      <article class="card">
        <img src="https://picsum.photos/id/1018/600/400" alt="호수 풍경">
        <div class="card-body">
          <h3>호수 산책</h3>
          <p>잔잔한 물결 옆에서 여유로운 하루를 보냅니다.</p>
        </div>
      </article>
    </div>
  </section>
</body>
</html>
