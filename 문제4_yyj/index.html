<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/jquery.bxslider.css">
    <link rel="stylesheet" href="css/slick-theme.css">
    <link rel="stylesheet" href="css/slick.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/jquery.bxslider.js"></script>
    <script src="js/slick.js"></script>
    <script src="js/main.js"></script>
</head>
<body>
    <div class="notice">
        <div class="notice_top">
            <h2>알림판</h2>
            <div class="control">
                <span class="current">1</span>
                <span>/</span>
                <span>6</span>
                <button class="prev">
                    <img src="images/slider_prev.png" alt="이전">
                </button>
                <button class="pause">
                    <img src="images/slider_pause.png" alt="일시정지">
                </button>
                <button class="play">
                    <img src="images/slider_play.png" alt="재생">
                </button>
                <button class="next">
                    <img src="images/slider_next.png" alt="다음">
                </button>
            </div>
        </div>
        <div class="slider_wrap">
            <ul class="slider">
                <li>
                    <img src="images/1.png" alt="알림판 1">
                </li>
                <li>
                    <img src="images/2.jpg" alt="알림판 2">
                </li>
                <li>
                    <img src="images/3.jpg" alt="알림판 3">
                </li>
                <li>
                    <img src="images/4.png" alt="알림판 4">
                </li>
                <li>
                    <img src="images/5.jpg" alt="알림판 5">
                </li>
                <li>
                    <img src="images/6.png" alt="알림판 6">
                </li>
            </ul>
        </div>
    </div>
</body>
</html>
