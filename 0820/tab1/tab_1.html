<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 탭버튼 */
    .tab-buttons{
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
    }
    .tab-buttons button{
        padding: 10px 20px;
        border: none;
        cursor: pointer;
        background: #eee;
        border-radius: 5px;
        transition: background 0.3s;
    }
    .tab-buttons button.active{
        background: #007BFF;
        color: white;
    }
    /* 탭내용 */
    .tab-content{
        display: none;
        padding: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }
    .tab-content.active{
        display: block;
    }
    </style>
</head>
<body>
    <h1>메뉴</h1>
    <div class="tab-buttons">
        <button class="tab-link" data-tab="tab1">홈</button>
        <button class="tab-link" data-tab="tab2">소개</button>
        <button class="tab-link" data-tab="tab3">연락처</button>
    </div>
    <div id="tab1" class="tab-content active">
        <h2>홈</h2>홈 페이지 내용입니다. 여기에 메인 콘텐츠를 작성할 수 있습니다.
    </div>
    <div id="tab2" class="tab-content" active>
        <h2>소개</h2>소개 페이지 내용입니다. 회사나 개인에 대한 정보를 작성할 수 있습니다.
    </div>
    <div id="tab3" class="tab-content" active>
        <h2>연락처</h2>연락처 페이지 내용입니다. 연락 방법을 안내 할 수 있습니다.
    </div>
</body>
</html>
<script>
    const tabLinks = document.querySelectorAll('.tab-link'); //버튼들
    const tabContents = document.querySelectorAll('.tab-content'); //내용들

    tabLinks.forEach(function(button){
        button.addEventListener("click",function(){
           const targetId = button.getAttribute("data-tab"); // tab1, tab2, tab3
        // alert(targetId);
        // 모든버튼을 비활성화
        // tabLinks.forEach(function(btn){ // 버튼을 순회하면서 클래스active 제거
        //     btn.classList.remove('active');
        // });

        tabLinks.forEach(btn => btn.classList.remove("active"));
        //현재 클릭한 버튼에 active 클래스 부여
        button.classList.add("active");

        // tabContent(내용) active제거 - 내용 숨기기
        tabContents.forEach(content => content.classList.remove('active'));

        // 내용활성화
        document.getElementById(targetId).classList.add('active');
        });
    });
</script>
