<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <style>
        *{margin: 0;padding: 0;}
        ul{list-style: none;}
        .content{
            width: 300px;
        }
        .tab{
            display: flex;
            gap: 10px;
        }
        .tab li{
            background-color: #fff;
        }
        .tab li.on{
            background-color: red;
            color: #fff;
        }
        .tab_list > div{
            height: 50px;
            line-height: 50px;
            display: none;
        }
        .tab_list > div.on{
            display: block;
        }
    </style>
</head>
<body>
    <div class="content">
    <ul class="tab">
         <li class="on">1번</li><!-- index 0 -->
         <li>2번</li><!-- index 1 -->
         <li>3번</li><!-- index 2 -->
      </ul>
      <div class="tab_list">
        <div class="on">1번의 내용입니다.</div><!-- index 0 -->
        <div>2번의 내용입니다.</div><!-- index 1 -->
        <div>3번의 내용입니다.</div><!-- index 2 -->
      </div>
      </div>
</body>
</html>
<script>
    $('.tab li').click(function(){
        var i = $(this).index();
        // alert(i);
        $('.tab li').removeClass('on');
        $('.tab li').eq(i).addClass('on');
        $('.tab_list div').removeClass('on');
        $('.tab_list div').eq(i).addClass('on');
    });
</script>
