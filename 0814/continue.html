<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num
        for(num = 1; num <= 10; num++){
            if (num == 4) {
                continue;
                //조건이 참일 때만 실행하지않고 다시 복귀해서 돌아간다
            }
            document.write(num, " , ");
        }
    </script>
</body>
</html>
