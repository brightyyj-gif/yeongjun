<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var num = prompt("숫자를 입력하세요");
        if(num >= 3 && num <= 5){
             document.write("3~5 봄입니다");
        }else if(num >= 6 && num <= 8){
            document.write("6~8 여름입니다");
        }else if(num >= 9 && num <= 11){
            document.write("9~11 가을입니다");
        }else if(num == 12 || num == 1 || num == 2){
            document.write("12, 1, 2 겨울입니다");
        }else{
            document.write("재입력");
        }
    </script>
</body>
</html>
