<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
#myball{
    position: relative;
    height: 100px;
    width: 100px;
    border-radius: 50px;
    border: 1px solid #000;
    background: url(img/f1.png) no-repeat 50% 50%;     
    animation: myani 3s forwards;
    /* 애니메이션 끝부분 상태로 종료 */       
}
@keyframes myani{
    0%{left:10px;}
    100%{left:500px;}
}


#myball1{
    position: relative;
    height: 100px;
    width: 100px;
    left:500px;
    border-radius: 50px;
    border: 1px solid #000;
    background: url(img/f1.png) no-repeat 50% 50%;     
    animation: myani1 3s 3s forwards;
    /* 에니 :이름 진행시간 지연시간  애니끝난후 도착점  */

    /* animation-delay: 3s ;  3초 지연후 애니메이션 시작 */
       
}
@keyframes myani1{
    0%{left:500px;}
    100%{left:10px;}
}



</style>
</head>
<body>
     <div id="myball"></div>
     <div id="myball1"></div>
     
</body>
</html>
