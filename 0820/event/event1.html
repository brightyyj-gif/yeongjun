<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- | 이벤트       | 설명              |
| --------- | --------------- |
| click     | 마우스 클릭          |
| dblclick  | 더블클릭            |
| mouseover | 마우스를 올림         |
| mouseout  | 마우스를 벗어남        |
| keydown   | 키를 누름           |
| keyup     | 키를 뗌            |
| input     | 입력값이 변경됨        |
| change    | 값이 변경되고 포커스를 잃음 |
| submit    | 폼 전송            |
| load      | 페이지 로드 완료       | -->
<!-- 웹페이지에서 사용자의 행동이나 브라우저의 동작을 감지하는 기능 -->
<!-- 사용자 행동(클릭,마우스 업다운) -> 이벤트 발생 -> 자바스크립트 실행 -->
<!-- 버튼클릭 -> 클릭이벤트 발생 -> alert("안녕하세요") -->
<button onclick="hello()">클릭</button>
<script>
    function hello(){
        alert("안녕하세요");
    }
</script>

</body>
</html>
