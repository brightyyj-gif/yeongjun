<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    h3{display: inline-block;vertical-align: middle;}
</style>
<body>
    <!-- 이미지 요소 -->
     <img src="images/dog1.jpg" width="300" alt="강아지사진1" title="강쥐1">
     <img src="images/dog2.jpg" width="300" alt="강아지사진2">
     <img src="images/dog3.jpg" width="300" alt="강아지사진3">
     <img src="images/dog4.jpg" width="300" alt="강아지사진4">
     <!-- 인라인 블럭요소 - 넓이 높이는 가질 수 있지만 줄바뀜은 안됨 -->
    
     <div>
        <h2>우리 강쥐 분양합니다.</h2>
        <img src="images/dog1.jpg" width="300" alt="강아지사진1" title="강쥐1">
        <h3>우리 강쥐는 애교가 많습니다. <br/>
            집에 상주해 계시는 분에게만 분양합니다. <br/>
            책임분양비 5만원 있습니다. 
        </h3>
     </div>
     <hr>
     <video autoplay muted loop width="400">
        <source src="media/ck.mp4" type="video/mp4"> 
     </video>
<!-- autoplay 자동재생일 경우 muted 묵음일 때 만 자동이 된다. loop-반복재생 -->

     <video controls width="400">
        <source src="media/ck.mp4" type="video/mp4"> 
     </video>
</body>
</html>
