<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/jquery.bxslider.css">
    <script src="js/jquery-3.1.1.min.js"></script>
    <script src="js/jquery.bxslider.min.js"></script>
    
    <style>
        *{margin: 0;padding: 0;}
        header{
            width: 960px;
            height: 200px;
            margin: 0 auto;
            background-color: pink;
        }
        section{
            width: 960px;
            height: 800px;
            margin: 0 auto;
            border: 1px solid red;
        }
    </style>

    <script>
        $(function(){
            // ul 클래스 slider
            $(".slider1").bxSlider({
                mode:'vertical', // 기본은 수평, 'fade' - 나타났다가 사라짐 'vertical' - 수직
                auto:true, // 자동슬라이드
                speed:500, // 사진 한 장이 넘어가는 속도
                pause:2000, // 실제 슬라이드 속도
                controls:false, // 좌우 화살표 숨김
                pager:false // 페이저 숨김
            });

            $(".slider2").bxSlider({
                auto:true, // 자동슬라이드
                moveSlides:2, // 한번에 슬라이드되는 사진 수
                minSlides:1, // 반응형
                maxSlides:4, // 반응형
                slideWidth:230, // 한개 슬라이드 이미지의 넓이
                slidemargin:10, // 슬라이드간의 여백

            });
        });
    </script>
</head>
<body>
    <header>헤더</header>
    <section>
        <ul class="slider1">
            <li><img src="images/pic1.jpg" alt="사진11"></li>
            <li><img src="images/pic2.jpg" alt="사진22"></li>
            <li><img src="images/pic3.jpg" alt="사진33"></li>
        </ul>

        <ul class="slider2">
            <li><img src="img/images(1).jpg" alt="사진1"></li>
            <li><img src="img/images(2).jpg" alt="사진2"></li>
            <li><img src="img/images(3).jpg" alt="사진3"></li>
            <li><img src="img/images(4).jpg" alt="사진4"></li>
            <li><img src="img/images(5).jpg" alt="사진5"></li>
        </ul>
    </section>
</body>
</html>
