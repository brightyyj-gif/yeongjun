<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    .wrap{
        width: 50%;
        margin: 30px auto 0;
    }
    .accordion{
        border: 1px solid #ccc;
        margin-bottom: 5px;
        cursor: pointer;
        padding: 10px;
        background: #f5f5f5;
    }
    .panel {
        display: none;
        padding: 10px;
        border: 1px solid #ccc;
        border-top: none;
    }
    .accordion.active {
        background: #007bff;
        color: white;
    }
</style>
</head>
<body>
    <div class="wrap">
    <h2>아코디언 메뉴 예제</h2>
    <div class="accordion">🍎 사과</div>
    <div class="panel">사과는 빨갛고 달콤합니다.</div>
    <div class="accordion">🍌 바나나</div>
    <div class="panel">바나나는 노랗고 길쭉합니다.</div>
    <div class="accordion">🍇 포도</div>
    <div class="panel">포도는 보라색이고 송이로 열립니다.</div>
    </div>
</body>
</html>
<script>
    const accordions = document.querySelectorAll(".accordion"); // accordion 클래스 3개
    accordions.forEach(function(acc){
        acc.addEventListener("click", function(){ //모든 아코디언에 클릭이벤트를 등록
            accordions.forEach(function(a){
                a.classList.remove('active'); //active class 제거
                a.nextElementSibling.style.display = 'none'; // 아코디언 다음오는 (panel)을 닫는다
            });
            // 현재 클릭한 아코디언 .active를 추가 다음에 있는(panel) 패널 열기
            acc.classList.add('active');
            acc.nextElementSibling.style.display="block";
        });
    });
</script>
