<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let users = [
            {name: '홍길동', age: 25},
            {name: '김철수', age: 30},
            {name: '이영희', age: 28},

        ];

        // 순회
        users.forEach(user => {
            console.log(`${user.name}: ${user.age}세`);
        });

        // 필터링
        let young = users.filter(user => user.age < 30);
        console.log(young);
    </script>
</body>
</html>
