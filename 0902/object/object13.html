<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

    let user1 = {
        name: '홍길동',
        age: 25,
    };

// 방법 1: 전개 연산자
let user2 = {...user1}; // user1의 속성을 펼져서 새 객체{}안에넣습니다.

// 방법 2: Object.assign()
let user3 = Object.assign({},user1); // 빈 객체 {}dp user1ㅇ 속성을 복사

user2.name = '김철수';
console.log(user1.name); // '홍길동' (원본변경안됨)
console.log(user2.name); // '김철수'


    </script>
</body>
</html>
