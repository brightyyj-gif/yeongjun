<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>회원가입</h1>
    <form action="/join" method="post">
        <fieldset>
            <legend>회원 정보 입력</legend>
            <p>
                <label for="userid">아이디</label><br>
                <input type="text" name="userid" id="userid" placeholder="아이디를 입력하세요" required>
            </p>
            <p>
                <label for="userpw">비밀번호</label><br>
                <input type="text" name="userpw" id="userpw" placeholder="" required>
            </p>
            <p>
                <label for="userpw">비밀번호 확인</label><br>
                <input type="text" name="userpw" id="userpw" placeholder="" required>
            </p>
            <p>
                <label for="name">이름</label><br>
                <input type="text" name="name" id="name" placeholder="" required>
            </p>
            <p>
                <label for="email">이메일</label><br>
                <input type="email" name="email" id="email" placeholder="" required>
            </p>
            <p>
                <label for="tel">전화번호</label><br>
                <input type="tel" name="tel" id="tel" maxlength="11" placeholder="" required>
            </p>
            <p>
                <label for="birth">생년월일</label><br>
                <input type="date" id="d-day">
            </p>
            <p>성별<br>
                <label><input type="radio" name="gender" value="male"> 남자</label>
                <label><input type="radio" name="gender" value="female"> 여자</label>
            </p>
            <p>취미<br>
                    <label><input type="checkbox" name="hobby" value="java"> Java</label>
                    <label><input type="checkbox" name="hobby" value="html"> Html</label>
                    <label><input type="checkbox" name="hobby" value="sprinboot"> Spring boot</label>
            </p>
            <p>
            <label for="city">지역</label><br>
            <select id="city" name="city">
            <option value="seoul">서울</option>
             <option value="busan">부산</option>
             </select>
             </p>
             <p>
                <label for="job">직업</label><br>
                <input type="text" name="job" id="job" placeholder="" required>
             </p>
             <p>
                <label for="file">프로필 사진</label><br>
                <input type="file" name="file" id="file">
             </p>
             <p>
                <label for="memo">자기소개</label><br>
                <textarea name="memo" id="memo" cols="40" rows="4"></textarea>
             </p>
             <p>
                <input type="submit" value="회원가입">
                <input type="reset" value="다시작성">
             </p>
        </fieldset>
    </form>
</body>
</html>
