<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var sum = 0;
        var i = 2;
        document.write("2단<br>");
        for(var j = 1; j <= 9; j++){
            sum = i * j;
            // document.write(i + 'X' + j + "=" + (sum) + '<br>')
            //백틱문법 변수는 무조건 ${변수명}
            //따옴표나 쌍 따옴표는 생략 전체를 ``(~) 로 감싼다
            document.write(`${i}X${j}=${sum}<br>`);
        }

    </script>
</body>
</html>
