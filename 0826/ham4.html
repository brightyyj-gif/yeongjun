<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
<!-- 주소가 올바르지 않으면  $ is not defined -->

  <script>
    $(function(){
        $('.ham').click(function(){
           $('.ham').toggleClass('on');
           $('nav').toggleClass('active');
        });
        $('.sub').hide();
        $('nav>ul>li>a').click(function(){
            var status = $(this).next('.sub').css('display');
            // alert(status);
            if(status == 'none'){
                $('.sub').slideUp(500);
                $(this).next('.sub').slideDown(500);
            } else{
                $('.sub').slideUp(500);
            }

            return false;
        });
    });
    
  </script>

<style>
        * {
        margin: 0;
        padding: 0;
    }

    ul {
        list-style: none;
    }
    body{
        overflow-x: hidden;
    }

    header{
         width: 100%;
        height: 70px;
        position: relative;
        background-color: skyblue;
    }
    header h1{
         line-height: 70px;
         height: 70px;
         text-align: center;
    }
    header p.ham{
        position: absolute;
        width:50px;
        height:50px;
        top:10px;
        right:10px;
        border: 1px solid #333;
        text-indent:-9999px ;
        background: url(images/ham.png) no-repeat 50% 50%; 
        /* 햄버거 버튼 */
        cursor: pointer;
    }
     header p.ham.on{
        background: url(images/bar.png) no-repeat 50% 50%;
        /* X 버튼 */
     }
    nav{
        width: 200px;
        background-color: lime;
        padding: 10px 0;
        position: absolute;
        top: 70px;
        right:-200px; 
        transition: all 0.3s;
    }
    nav.active{
        right:0;
    }

    nav ul li {
        /* height: 40px; */
        line-height: 40px;
        text-align: center;
        font-weight: bold;
    }
    nav ul li .sub{
        background-color: yellowgreen;
    }
    .m_menu > li > a{
        display: block;
        height: 36px;
        background-color: #390;
        line-height: 36px;
        border-top: 1px dotted #fff;
        color: #fff;
    }   
    .m_menu .sub li{
        background-color: #cf9;
    }
    .m_menu .sub li a{
        display: block;
        line-height: 36px;
        height: 36px;
        color: #222;
    }
    .m_menu .sub li a:hover {
        background-color: #cf0;
    }
</style>


</head>
