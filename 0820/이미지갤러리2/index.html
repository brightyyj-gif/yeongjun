<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0; padding: 0;}
        ul,li{list-style: none;}
        body{background-color: #333;}

        #wrap{
            display: flex;
            flex-direction: column;
            width: 640px;
            margin: 100px auto 0;
        }
        nav{
            display: flex;

        }
        #nav li a{
            display: block;
            border: 2px solid #ccc;
            margin: 0 6px 10px 0;
            border-radius: 5px;
        }
        #nav li a.active{
            border: 2px solid #fff
        }
        #nav li a img{
            width: 70px;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <ul id="nav">
            <li><a href="img/lop0.jpg"><img src="img/thumb0.jpg" alt="tiger0"></a></li>
            <li><a href="img/lop1.jpg"><img src="img/thumb1.jpg" alt="tiger1"></a></li>
            <li><a href="img/lop2.jpg"><img src="img/thumb2.jpg" alt="tiger2"></a></li>
            <li><a href="img/lop3.jpg"><img src="img/thumb3.jpg" alt="tiger3"></a></li>
            <li><a href="img/lop4.jpg"><img src="img/thumb4.jpg" alt="tiger4"></a></li>
            <li><a href="img/lop5.jpg"><img src="img/thumb5.jpg" alt="tiger5"></a></li>
            <li><a href="img/lop6.jpg"><img src="img/thumb6.jpg" alt="tiger6"></a></li>
            <li><a href="img/lop7.jpg"><img src="img/thumb7.jpg" alt="tiger7"></a></li>
        </ul>
        <div id="window"><img src="img/lop0.jpg" alt=""></div>
    </div>
</body>
</html>
<script>
    let navLinks = document.querySelectorAll("#nav li a"); // 8개 a 등록 (중복등록)
    navLinks.forEach(function(navLink){
        navLink.addEventListener('click',function(e){
            e.preventDefault(); // a이벤트를 막아서 링크 금지

            let img_url = navLink.getAttribute('href'); //a 주소값(큰이미지)
            alert(img_url);

            document.querySelector("#window img").setAttribute('src', img_url);

            navLinks.forEach(function(link){
                link.classList.remove('active');

            });
            navLink.classList.add('액티브') //클릭된 a (navLink)에 active추가
        });
        });
    
</script>
