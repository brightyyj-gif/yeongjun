<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            font-size: 60px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        .heading{
            width: 700px;
            height: 200px;
            line-height: 200px; /*한줄 일 때 쓰기좋음 */
            color: white;
            background-color: #222;
            margin-left: auto; /* h1 컨텐츠 자체를 중앙정렬*/
            margin-right: auto; /* h1 컨텐츠 자체를 중앙정렬*/
            text-align: center; /* h1안에 있는 글자 또는 이미지 중앙정렬*/
        }
    </style>
</head>
<body>
    <h1 class="heading">HTML</h1>
</body>
</html>
