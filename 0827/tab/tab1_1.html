<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <style>
        *{margin: 0;padding: 0;}
        ul{list-style: none;}
        .tab{
            width: 300px;
            border: 1px solid #000;
        }
        .tab_menu{
            display: flex;
            gap: 10px;
        }
        .tab_menu li{
            background-color: #fff;
            
        }
        .tab_menu li.on{
            padding: 10px;
            background-color: red;

            color: #fff;
        }
        .tab_list > li{
            height: 200px;
            /* line-height: 50px; */
            display: none;
        }
        .tab_list > li.on{
            display: block;
        }
    </style>
</head>
<body>
    <div class="tab">
        <ul class="tab_menu">
            <li class="on">공지사항</li>
            <li>갤러리</li>
            <li>정보마당</li>
        </ul>
        <ul class="tab_list">
            <li class="on">
                <div>공지사항입니다.</div>
                <div>공지사항입니다.</div>
                <div>공지사항입니다.</div>
                <div>공지사항입니다.</div>
            </li>
            <li>
                <div>갤러리입니다.</div>
                <div>갤러리입니다.</div>
                <div>갤러리입니다.</div>
                <div>갤러리입니다.</div>
            </li>
            <li>
                <div>정보마당입니다.</div>
                <div>정보마당입니다.</div>
                <div>정보마당입니다.</div>
                <div>정보마당입니다.</div>
            </li>
        </ul>
    </div>
</body>
</html>
<script>
    $('.tab_menu li').click(function(){
    var i = $(this).index();

    // 탭 버튼s
    $('.tab_menu li').removeClass('on');
    $(this).addClass('on');

    // 탭 내용
    $('.tab_list > li').removeClass('on');
    $('.tab_list > li').eq(i).addClass('on');
});
</script>
