<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>javascript에서 map() 이란?</h1>
    <h3>배열의 각요소를 하나씩 꺼내서 원하는 작업을 한 후,<br>
    그 결과를 새로운 배열로 만들어 주는 메서드</h3>
    <pre>
        const 새로운배열 = 배열.map(function(요소){
            return 결과;
        });
        const 새로운배열 = 배열.map((요소) => {
            return 결과;
        });
    </pre>

    <script>
        // 객체 리터럴
        const users = [
            {name:"홍길동", age : 25},
            {name:"이몽룡", age : 20},
            {name:"성춘향", age : 22}
        ];
        console.log(users[0].name); // 추천
        console.log(users[0]["name"]);

        // map으로 이름만 추출
        const names = users.map((user) => user.name)
        console.log(names);

        // 새로운 배열  ...전개 연산자
        const newUsers = users.map((user) =>({
            ...user,
            age:user.age+1
        }));
        console.log(newUsers);
        // 기존배열의 객체들을 복사(...전개), 특정속성(age)만 수정된 새로운 객체
        // 을 만들어 내는 코드
        // ...user(전개연산자) - 기존 user 객체가 가지고있는 모든속성(name, age)를
        // 새로운 객체안에 그대로 펼쳐서(복사해서)가져온다.
        // age:user.age+1
        
        // 소괄호 () => ({...}):
        // 화살표 함수(=>) 뒤에 바로 객체{}를 반환할 때, 자바스크립트가 이를 '함수의 블록 코드'로
        // 오해하지 않도록 소괄호로 감싸서 객체 리터럴임을 명시해 준 것이다.
    </script>

</body>
</html>
