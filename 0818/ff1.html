<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    //prompt 문자를 입력받음
    var num1 = Number(prompt("첫번째 숫자입력","0"));
    var num2 = parseInt(prompt("두번째 숫자입력","0")); //Integer.parseInt - 자바
    //parseInt(10.5px) -> 10 문자열을 정수로 변환


    var result = num1 + num2;
    document.write(result);
    </script>
</body>
</html>
