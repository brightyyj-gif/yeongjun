<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .round1{
            border-radius: 50%;
        }
        .box{
            width: 300px;
            height: 300px;
            border: 1px solid #333;
            margin-top: 50px;
        }
        .box1{
            border-radius: 50%;
        }
        .box2{
            border-radius: 150px;
        }
        .box3{
            border-radius: 25px 0 25px 0;
        }
        /* 좌상 우상 우하 좌하 - 좌상부터 시계방향 */
        .box4{
            width: auto;
            height: auto;
            /* 높이 넓이 취소 */
            display: inline-block;
            padding: 5px 30px;
            border-radius: 20px;
            background-color: pink;
            cursor:pointer; /* 손가락 */
        }
        .box:hover{
            background-color: hotpink;
            color: #fff;
        }
        .box5{
            background-image: url(images/cat2.jpg);
            background-position: 50% 50%;
            background-size: cover;
            border-radius: 50%;
            box-shadow: 5px 5px 10px #222;
            /* 박스 그림자: 처음은 x위치 두번째는 y위치 세번째는 blur(안개효과) 네번째는 색상 */
            /* x위치 - 음수: 좌측 양수는 : 우측 */
            /* y위치 - 음수: 위 양수 : 아래 */
        }
    </style>
</head>
<body>
    <img src="images/cat1.jpg" alt="고양이1">
    <img src="images/cat2.jpg" alt="고양이2" class="round1">
    <div class="box box1">원1</div>
    <div class="box box2">원2</div>
    <div class="box box3">원3</div>
    <div class="box box4">원4</div>
    <div class="box box5">원5</div>
    <div class="box box6">원6</div>
</body>
</html>
