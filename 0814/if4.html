<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let age = prompt("나이를입력","");
        let result;

        if(age < 13 || age >= 65){
            result = 2000;
        }else if(age >= 13 && age < 20){
            result = 4000;
        }else{
            result = 6000;
        }
        document.write('당신이 내야할 입장료는 ' + result);
    </script>
</body>
</html>
