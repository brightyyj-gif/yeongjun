<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let today = new Date();
        // alert(today);
        console.log(today);
        console.log(today.getFullYear());
        console.log(today.getMonth()+1); // 0 ~ 11 월로 표기됨
        console.log(today.getDate());
        console.log(today.getDay()); // 일 ~ 토 까지를 0부터 6까지 표기

    </script>
</body>
</html>
