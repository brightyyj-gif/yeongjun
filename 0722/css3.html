<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- class는 앞에 .붙이기 p보다 강함-->
     <!-- id는 앞에 #을 붙임 누구보다 강함 예외(important)-->
      
<style>
.vio{background-color: violet;}
.gre{background-color: green;}
p{background-color: red;}
.bb{background-color: blue;}
#bb{background-color: yellow;}
</style>
</head>
<body>
    <h1 class="vio">나는 보라색</h1>
    <h1 class="gre">나는 초록색</h1>
    <p>나는 빨간색</p>
    <p class="bb">나는 파란색</p>
    <p id="bb">나는 노란색</p>
</body>
</html>
