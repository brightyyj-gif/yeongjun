<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.1.1.js"></script>
    
    <script>
//         $.getJSON("demo_ajax_json.js", function(result){
//             할일
//          });
        var url = 'https://api.openweathermap.org/data/2.5/forecast?id=1835848&appid=6e60a201e88946743052b97bbb9228a3&units=metric'

         $.getJSON(url, function(result){
            // alert(result.cod);
            // alert(result.city.name);
            console.log(result.list[0].main.temp);
            console.log(result.list[0].main.temp_min);
            console.log(result.list[0].main.temp_max);
            console.log(result.list[0].weather[0].icon);

            let $ctemp = result.list[0].main.temp;
            let $mintemp = result.list[0].main.temp_min;
            let $maxtemp = result.list[0].main.temp_max;
            let $cicon = result.list[0].weather[0].icon;
            let $cDate = result.list[0].dt_txt;
            
            $(".ctemp").append($ctemp);
            $('.clowtemp').append($mintemp);
            $('.chightemp').append($maxtemp);
            $('.h2').prepend($cDate);

            // $('.cicon').append(`<img src=https://openweathermap.org/payload/api/media/file/10d@2x.png>`);
            $('.cicon').append(`<img src=https://openweathermap.org/img/wn/${$cicon}@2x.png>`);
          });
    </script>
</head>
<body>
    <h1>weather api</h1>
    <h2>|날씨예보</h2>
    <div class="ctemp">현재 온도: </div>
    <div class="clowtemp">최저 온도: </div>
    <div class="chightemp">최고 온도:</div>
    <div class="cicon">아이콘: </div>
    <!-- <img src="https://openweathermap.org/payload/api/media/file/10d@2x.png" alt=""> -->
     <img src="https://openweathermap.org/payload/api/media/file/10d@2x.png" alt="">
    
</body>
</html>
